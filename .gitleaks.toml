# gitleaks config — allowlist arXiv ID false positives
[extend]
useDefault = true

[allowlist]
description = "arXiv ID patterns (NNNN.NNNN) are public refs, not API keys"
regexes = [
    '''arXiv:\d{4}\.\d{4,5}''',
    '''\d{4}\.\d{4,5}(v\d)?''',
    '''hep-[a-z]+/\d{7}''',
]
paths = [
    '''paper/cosmo_hayden_preskill/README\.md''',
]
