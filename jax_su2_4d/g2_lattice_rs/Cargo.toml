[package]
name = "g2_lattice"
version = "0.1.0"
edition = "2021"
description = "G_2 Lattice Gauge Theory Monte Carlo (Metropolis)"
authors = ["Kevin Remondiere"]

[dependencies]
nalgebra = "0.33"
rand = "0.8"
rand_distr = "0.4"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
