[package]
name = "kevinotron"
version = "1.0.0"
edition = "2021"
description = "Unified lattice gauge theory EE engine — SU(2), SU(3), SU(4), G2, Sp(4), SO(7)"
authors = ["Kevin Remondiere <kevin.remondiere@gmail.com>"]

[dependencies]
nalgebra = "0.33"
num-complex = "0.4"
rand = "0.8"
rand_distr = "0.4"
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
byteorder = "1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.build-override]
opt-level = 3
