# Projet Lean autonome : contrôles formels du théorème candidat « loi d'aire SU(2) 4D jusqu'à β_W = 0,81348 ».
# Lean 4.34.0, Mathlib v4.34.0 (rev 5ed2965256430c3649e86755f9576b54eca72435, the same Mathlib as the Lean project of the note D7, doi:10.5281/zenodo.23856414).
# Mathlib is fetched by lake from the git revision pinned in lake-manifest.json; `lake exe cache get` downloads the compiled library.
name = "loiaire"
version = "0.1.0"
defaultTargets = ["LoiAire"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[lean_lib]]
name = "LoiAire"

[[lean_exe]]
name = "verifcert"
root = "VerifCert"

[[lean_exe]]
name = "verifbanc"
root = "VerifBanc"
