# Standalone Lean 4 project for the one-link certificates of the note
# "Dobrushin uniqueness for the four-dimensional SU(2) Wilson lattice gauge measure for beta < 2/9" (v1.3).
# The six modules under KevYM/Certif/DobrushinCordale/ (chordal metric, main result) and
# KevYM/Certif/DobrushinLien/ (geodesic metric) are verbatim copies (byte-identical) of
# commit 1b0f039c53c1e2a11c496cc5a1cb7774ab5a010e of the author's Lean library; see README.md.
name = "dobrushin_su2_cert"
version = "1.3.0"
defaultTargets = ["DobrushinCert"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[lean_lib]]
name = "DobrushinCert"
roots = ["KevYM.Certif.DobrushinCordale.Verif", "KevYM.Certif.DobrushinCordale.Donnees", "KevYM.Certif.DobrushinCordale.Final",
         "KevYM.Certif.DobrushinLien.Verif", "KevYM.Certif.DobrushinLien.Donnees", "KevYM.Certif.DobrushinLien.Final"]
